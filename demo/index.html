<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VSM Renderer Demo</title>
    <script>
      // Set the theme before first paint: saved choice wins, otherwise follow
      // the OS preference.
      (function () {
        try {
          var t = localStorage.getItem('vsm-demo-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        color-scheme: light;
        --bg: #f0f2f5;
        --surface: #ffffff;
        --border: #dddddd;
        --text: #333333;
        --text-2: #666666;
        --text-3: #555555;
        --text-faint: #999999;
        --chip-bg: #f9f9f9;
        --chip-hover-bg: #e8f4f8;
        --chip-hover-border: #b8daff;
        --current-bg: #1b2330;
        --current-text: #ffffff;
        --primary: #1d3880;
        --primary-hover: #192d68;
        --on-primary: #ffffff;
        --canvas-bg: #ffffff;
        --btn-hover-bg: #f0f0f0;
      }

      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #14161c;
        --surface: #1e222b;
        --border: #333a47;
        --text: #e6e8ec;
        --text-2: #a8adb8;
        --text-3: #c0c5cf;
        --text-faint: #6b7280;
        --chip-bg: #262b36;
        --chip-hover-bg: #2e3a52;
        --chip-hover-border: #3d5a8a;
        --current-bg: #8fa8e8;
        --current-text: #14161c;
        --primary: #8fa8e8;
        --primary-hover: #a9bdf0;
        --on-primary: #14161c;
        --canvas-bg: #101218;
        --btn-hover-bg: #2a2f3a;
      }

      html,
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      .header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header h1 {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .canvas-container {
        flex: 1;
        display: flex;
        justify-content: safe center;
        align-items: safe center;
        background: var(--canvas-bg);
        overflow: auto;
        padding: 20px;
      }

      .canvas-container > div:fullscreen,
      .canvas-container > div::backdrop {
        background: var(--canvas-bg);
      }

      .sidebar {
        width: 280px;
        background: var(--surface);
        border-left: 1px solid var(--border);
        overflow-y: auto;
        padding: 16px;
        flex-shrink: 0;
        transition:
          width 0.25s ease,
          padding 0.25s ease,
          border-width 0.25s ease;
      }

      .sidebar.collapsed {
        width: 0;
        padding: 0;
        border-left-width: 0;
        overflow: hidden;
      }

      .sidebar-toggle,
      .theme-toggle {
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 13px;
        color: var(--text-3);
        cursor: pointer;
        line-height: 1;
        user-select: none;
      }

      .sidebar-toggle:hover,
      .theme-toggle:hover {
        background: var(--btn-hover-bg);
      }

      .section {
        margin-bottom: 24px;
      }

      .section h3 {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-2);
        margin-bottom: 12px;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .breadcrumb-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--chip-bg);
        color: var(--text);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }

      .breadcrumb-chip:hover {
        background: var(--chip-hover-bg);
        border-color: var(--chip-hover-border);
      }

      .breadcrumb-chip.current {
        background: var(--current-bg);
        color: var(--current-text);
        border-color: var(--current-bg);
      }

      .breadcrumb-sep {
        color: var(--text-faint);
        font-size: 13px;
      }

      .channel-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .channel-btn {
        border: 1px solid var(--border);
        background: var(--chip-bg);
        color: var(--text-3);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
      }

      .channel-btn:hover {
        background: var(--chip-hover-bg);
        border-color: var(--chip-hover-border);
      }

      .channel-btn.on {
        background: var(--primary);
        color: var(--on-primary);
        border-color: var(--primary);
      }

      .info-panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        background: var(--chip-bg);
      }

      .info-panel h4 {
        font-size: 13px;
        margin-bottom: 6px;
        color: var(--text);
      }

      .info-panel p {
        font-size: 12px;
        color: var(--text-2);
        line-height: 1.5;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
      }

      .btn:hover {
        background: var(--btn-hover-bg);
      }

      .btn.primary {
        background: var(--primary);
        color: var(--on-primary);
        border-color: var(--primary);
      }

      .btn.primary:hover {
        background: var(--primary-hover);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
