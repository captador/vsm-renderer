name: CI / Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Unit tests — runs on every PR and every push to main.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prettier --check .

      - run: pnpm typecheck

      - run: pnpm test

  # ─────────────────────────────────────────────────────────────────────────────
  # GitHub Pages — deploys the demo on every merge to main, after tests pass
  # and before any release. Not gated on code-change detection; the release
  # job below waits for this job, so the Pages site is always up to date
  # ahead of a release.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-pages:
    name: Deploy Demo to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

      - uses: actions/deploy-pages@v4
        id: deployment

  # ─────────────────────────────────────────────────────────────────────────────
  # Auto Release — runs only on pushes to main, after tests AND the Pages deploy
  # pass. Determines the next semantic version from conventional commit messages,
  # then creates a GitHub Release. publish.yml picks up the release event and
  # publishes the npm package to GitHub Packages and npmjs.
  #
  # Skipped when no prod package code and no release/publishing workflow file
  # changed since the last tag, so docs/demo-only pushes do not produce a
  # release (the Pages demo already deployed on merge above).
  #
  # Version bump rules (conventional commits):
  #   BREAKING CHANGE or type!:  →  major
  #   feat:                      →  minor
  #   fix: / chore: / docs: / …  →  patch
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Auto Release
    needs: [test, deploy-pages]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for code changes since last tag
        id: code-changes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          # Paths that trigger a release: prod package code plus the
          # release/publishing workflow files. Demo and docs changes do not
          # produce a release — the Pages demo already deployed on merge.
          PATHS="src package.json tsconfig.json vite.config.ts pnpm-lock.yaml pnpm-workspace.yaml .github/workflows"
          if [ -n "$LAST_TAG" ] &&
             [ -z "$(git diff --name-only "$LAST_TAG" HEAD -- $PATHS)" ]; then
            echo "No code changes since $LAST_TAG — skipping release."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine next version
        id: version
        if: steps.code-changes.outputs.changed == 'true'
        run: |
          # Commits since the last tag (or all commits if no tags yet).
          # The latest release tag is the source of truth for the current
          # version — package.json on main is not auto-bumped anymore.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            CURRENT=${LAST_TAG#v}
            CURRENT=${CURRENT%%-*}
            COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"%s%n%b")
          else
            CURRENT=$(node -p "require('./package.json').version")
            COMMITS=$(git log --pretty=format:"%s%n%b")
          fi

          # Determine bump type
          BUMP="patch"
          if echo "$COMMITS" | grep -qE '(^|\n)BREAKING CHANGE:' || \
             echo "$COMMITS" | grep -qiE '^[a-z]+(\(.+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            BUMP="minor"
          fi

          # Increment the appropriate component
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW"         >> $GITHUB_OUTPUT
          echo "bump=$BUMP"       >> $GITHUB_OUTPUT
          echo "tag=v$NEW"        >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.code-changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest
